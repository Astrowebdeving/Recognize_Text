name: packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          modules: 'qtshadertools'
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLOUPE_BUILD_APP=ON
          -DLOUPE_BUILD_TESTS=ON
          -DLOUPE_BUILD_STRESS_TESTS=ON
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ./build/loupe_stress_tests
      - name: Create self-contained DMG and ZIP
        run: |
          mkdir -p artifacts
          cpack --config build/CPackConfig.cmake -G DragNDrop -B artifacts
          cpack --config build/CPackConfig.cmake -G ZIP -B artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Document-Loupe-macOS
          path: artifacts/*
          if-no-files-found: error

  windows-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DLOUPE_BUILD_APP=ON
          -DLOUPE_BUILD_TESTS=ON
          -DLOUPE_BUILD_STRESS_TESTS=ON
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          & '.\build\Release\loupe_stress_tests.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Windows stress tests failed' }
      - name: Create Setup EXE, portable ZIP, and MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts | Out-Null
          cpack --config build/CPackConfig.cmake -C Release -G NSIS -B artifacts
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
          cpack --config build/CPackConfig.cmake -C Release -G ZIP -B artifacts
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }
          .\packaging\windows\package-msix.ps1 `
            -BuildDirectory build `
            -StageDirectory msix-stage `
            -OutputDirectory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Document-Loupe-Windows-x64
          path: artifacts/*
          if-no-files-found: error
